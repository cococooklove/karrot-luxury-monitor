# master 에 푸시하면 운영 서버가 그 커밋으로 갱신된다.
#
# 이 레포는 공개다. 그래서 자체 호스팅 러너는 쓰지 않는다 — 공개 레포에
# 붙인 러너는 누구든 fork PR 로 서버에서 코드를 실행할 수 있다.
# 대신 GitHub 호스팅 러너가 SSH 로 서버를 두드린다. secrets 는 fork PR 에
# 넘어가지 않고, 이 워크플로는 push 로만 돈다(pull_request 트리거 없음).
#
# 키가 새더라도 셸은 열리지 않는다. 서버 authorized_keys 가 이 키를
# `command="… -File C:\karrot_deploy.ps1"` 로 묶어 놨기 때문에, 무슨 명령을
# 보내든 그 스크립트만 실행된다.
name: deploy-server

on:
  push:
    branches: [master]
    # 문서만 고친 푸시로 앱을 2~3분 내리지 않는다.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:        # 손으로도 돌릴 수 있게

# 배포가 겹치면 install.ps1 이 서로의 폴더를 옮기려다 깨진다. 앞 배포를 죽이지도
# 않는다 — 중간에 끊기면 C:\karrot 이 반쯤 파인 채 남는다.
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.KARROT_DEPLOY_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # 호스트 키를 고정한다. 이게 없으면 중간자에게 배포 트리거를 넘겨줄 수 있다.
          printf '%s\n' "${{ vars.KARROT_HOST_KEY }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: 서버 갱신
        env:
          # 이 저장소는 public 이다. 배포 대상(계정@호스트)을 워크플로에 적어 두면
          # 운영 서버 주소가 그대로 공개된다 — 실제로 그렇게 커밋돼 있었다.
          # 리포지터리 변수 KARROT_DEPLOY_TARGET 에 `계정@호스트` 로 넣어 둔다.
          DEPLOY_TARGET: ${{ vars.KARROT_DEPLOY_TARGET }}
        run: |
          # 비어 있으면 조용히 다른 데로 붙는 대신 여기서 멈춘다.
          if [ -z "$DEPLOY_TARGET" ]; then
            echo "::error::리포지터리 변수 KARROT_DEPLOY_TARGET 이 비어 있습니다." \
                 "Settings → Secrets and variables → Actions → Variables 에" \
                 "'계정@호스트' 형식으로 등록하세요."
            exit 1
          fi
          # 보내는 명령은 무시된다 — authorized_keys 의 command= 가 이긴다.
          # ServerAlive 로 죽은 연결에 매달리지 않게 한다(재설치는 10분 넘게 걸린다).
          ssh -i ~/.ssh/deploy \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              "$DEPLOY_TARGET" deploy
