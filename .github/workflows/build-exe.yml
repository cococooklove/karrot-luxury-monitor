name: build-exe

# 당근 명품 모니터 — 풀 PyQt6 앱(manual_gui) Windows exe 빌드.
# 수동 실행(Actions > Run workflow) 또는 관련 경로 변경 푸시 시.
# 결과: Artifacts 에서 KarrotMonitor 폴더(exe + 설정예제) 다운로드.

on:
  workflow_dispatch:
  push:
    paths:
      - "delivery/integrated/manual_gui/**"
      - "tools/ld_harvest.py"
      - ".github/workflows/build-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: delivery/integrated/manual_gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install "bs4>=0.0.2" "curl-cffi>=0.13.0" "openpyxl>=3.1.5" "pillow>=12.0.0" "pyqt6>=6.10.0" "gspread>=6.0.0" pyinstaller

      - name: exe 빌드
        run: >
          pyinstaller --onefile --windowed --name KarrotMonitor
          --collect-all curl_cffi
          --collect-all PyQt6
          --collect-submodules daangn
          --collect-submodules daangn_ext
          --hidden-import gspread
          --hidden-import openpyxl
          --hidden-import PIL
          main.py

      - name: 설정 예제 동봉
        run: |
          copy settings.example.txt dist\settings.txt
          copy notify.example.json dist\notify.json
          if (Test-Path proxies.example.txt) { copy proxies.example.txt dist\proxies.txt }

      - uses: actions/upload-artifact@v4
        with:
          name: KarrotMonitor
          path: |
            delivery/integrated/manual_gui/dist/KarrotMonitor.exe
            delivery/integrated/manual_gui/dist/settings.txt
            delivery/integrated/manual_gui/dist/notify.json
            delivery/integrated/manual_gui/dist/proxies.txt
          retention-days: 30
          if-no-files-found: warn
